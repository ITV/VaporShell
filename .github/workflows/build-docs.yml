name: Build and Deploy Docs
permissions:
  contents: write
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Install PowerShell Modules 📦
        run: |
            Install-Module -Name platyPS -Force -Scope CurrentUser
        shell: pwsh

      - name: Build 🔧
        run: |
            # glossaryUpdater.ps1 must run first since the VaporShell module is built there
            . ./docs/ci/glossaryUpdater.ps1
            . ./docs/ci/glossarydataCSVGenerator.ps1
        shell: pwsh

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          ACCESS_TOKEN: ${{ secrets.ECP_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs
          COMMIT_MESSAGE: '[skip ci] Updating docs from GitHub Actions'
