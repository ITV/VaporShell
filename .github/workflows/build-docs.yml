name: Build and Deploy Docs
permissions:
  contents: write
on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Install PowerShell Modules 📦
        run: |
          $localModules = Get-Module -ListAvailable
          'platyPS', 'AWS.Tools.S3', 'AWS.Tools.CloudFormation' | ForEach-Object {
            if ($_ -notin $localModules.Name) {
              Install-Module -Name $_ -Force -Scope CurrentUser
            }
          }
        shell: pwsh

      - name: Build 🔧
        run: |
            # glossaryUpdater.ps1 must run first since the VaporShell module is built there
            . ./docs/ci/glossaryUpdater.ps1
            . ./docs/ci/glossarydataCSVGenerator.ps1
        shell: pwsh

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.ECP_TOKEN }}
          branch: gh-pages
          folder: docs
          commit-message: '[skip ci] Updating docs from GitHub Actions'
