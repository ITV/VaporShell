name: Build and Deploy Docs
permissions:
  contents: write
on:
  # XXX docs site does not seem to work properly at the moment - parking it, no time
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - '*'
  workflow_dispatch:
    # XXX CANCEL ON NEW MERGE
    # XXX consider installing from ecp repo rather than building (may be ahead of the actual published module)
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install PowerShell Modules 📦
        run: |
          $localModules = Get-Module -ListAvailable
          'platyPS', 'AWS.Tools.S3', 'AWS.Tools.CloudFormation' | ForEach-Object {
            if ($_ -notin $localModules.Name) {
              Install-Module -Name $_ -Force -Scope CurrentUser
            }
          }
        shell: pwsh

      - name: Build 🔧
        run: |
            # glossaryUpdater.ps1 must run first since the VaporShell module is built there
            . ./docs/ci/glossaryUpdater.ps1
            . ./docs/ci/glossarydataCSVGenerator.ps1
        shell: pwsh

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          token: ${{ secrets.ECP_TOKEN }}
          branch: gh-pages
          folder: docs
          commit-message: '[skip ci] Updating docs from GitHub Actions'
